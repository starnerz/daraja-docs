name: deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages.
permissions:
    contents: read
    pages: write
    id-token: write

# One deployment at a time; queued runs are not cancelled mid-deploy.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        name: Build

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # Analytics and verification tags are emitted only when these are set.
            # They are repository variables, so turning them on needs no code change.
            - name: Build site
              run: npm run build
              env:
                  PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
                  GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
                  GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
                  BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        name: Deploy
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
